<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tilim & Nigel Bingo</title>
<style>
:root{--cream:#f8efdf;--brown:#33231d;--red:#c85d45;--green:#657044;--gold:#efd9b2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#e3b87955,transparent 35%),var(--cream);color:var(--brown);font-family:Arial,sans-serif;padding:18px}.app{max-width:620px;margin:auto;text-align:center}.eyebrow{color:var(--red);font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:clamp(30px,8vw,48px);line-height:1;margin:8px 0}.sub{color:#8c7669;font-size:13px;margin-bottom:14px}.card{background:#fffaf0ee;border:2px solid white;border-radius:24px;padding:16px;box-shadow:0 12px 35px #512d1d22}.setup{display:flex;gap:8px;margin-bottom:12px}.setup input{min-width:0;flex:1;border:2px solid #ead5b2;border-radius:12px;padding:11px;font-size:14px}.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--red);color:#fff;font-weight:bold;cursor:pointer}.btn.green{background:var(--green)}.btn.light{background:var(--gold);color:var(--brown)}.status{background:#f2dfba;border-radius:13px;padding:9px;margin:8px 0 12px;font-size:13px}.players{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12px}.player{flex:1;padding:8px;border-radius:11px;background:#f4e6cf}.player.you{outline:2px solid var(--green);font-weight:bold}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cell{aspect-ratio:1;border:0;border-radius:13px;background:#efdbb8;color:var(--brown);font-size:clamp(21px,7vw,34px);font-weight:bold;cursor:pointer;box-shadow:inset 0 -5px #d3b585}.cell.marked{background:var(--green);color:white;box-shadow:inset 0 -5px #4b542f}.cell.marked:after{content:"";display:block;height:6px;width:82%;margin:-5px auto 0;background:#f7d77c;border-radius:8px;transform:rotate(-35deg)}.controls{display:flex;gap:7px;margin-top:12px}.controls .btn{flex:1}.hint{color:#8c7669;font-size:11px;margin-top:10px;line-height:1.4}.hidden{display:none}@media(max-width:430px){body{padding:10px}.card{padding:11px}.setup{flex-wrap:wrap}.setup input{flex-basis:100%}}
</style>
</head>
<body><main class="app"><div class="eyebrow">A little game for two</div><h1>Tilim & Nigel Bingo</h1><div class="sub">Create a room, share the link, and play together.</div><section class="card"><div class="setup"><input id="roomInput" placeholder="Room code, e.g. TILIM25" maxlength="20"><button class="btn green" id="joinBtn">Join room</button><button class="btn" id="createBtn">Create</button></div><div id="shareBox" class="hidden"><button class="btn light" id="shareBtn">Copy share link</button></div><div class="status" id="status">Enter a room code or create a new room.</div><div class="players"><div class="player" id="p1">Player 1: waiting</div><div class="player" id="p2">Player 2: waiting</div></div><div class="board" id="board"></div><div class="controls"><button class="btn green" id="randomBtn">Randomize</button><button class="btn light" id="customBtn">Customize</button><button class="btn" id="resetBtn">Reset</button></div><div class="hint">Your board is private to you. Mark a called number by tapping it. Five in a row wins.</div></section></main>
<script type="module">
const firebaseConfig={apiKey:"AIzaSyBenRdfIBhWOpwhjt3vg7OUI8M0409OXX8",authDomain:"tilim-nigel-bingo.firebaseapp.com",databaseURL:"https://tilim-nigel-bingo-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"tilim-nigel-bingo",storageBucket:"tilim-nigel-bingo.firebasestorage.app",messagingSenderId:"4732878543",appId:"1:4732878543:web:eca31f544f133425fe41ba"};
const firebaseReady=true;
let db,room="",playerId=localStorage.getItem("bingoPlayerId")||crypto.randomUUID(),custom=false,board=[],marked=[];
localStorage.setItem("bingoPlayerId",playerId);
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;
function shuffled(){let a=Array.from({length:25},(_,i)=>i+1);for(let i=24;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){let el=$("board");el.innerHTML="";board.forEach((n,i)=>{let b=document.createElement("button");b.className="cell"+(marked.includes(i)?" marked":"");b.textContent=n||"";b.onclick=()=>tap(i);el.appendChild(b)})}
function lines(){let a=[];for(let r=0;r<5;r++)a.push([...Array(5)].map((_,c)=>r*5+c));for(let c=0;c<5;c++)a.push([...Array(5)].map((_,r)=>r*5+c));a.push([0,6,12,18,24],[4,8,12,16,20]);return a}
function bingo(){return board.length===25&&board.every(Boolean)&&lines().some(x=>x.every(i=>marked.includes(i)))}
async function tap(i){if(!room)return status("Join or create a room first.");if(custom){let v=prompt("Enter a unique number from 1 to 25:",board[i]||"");if(v===null)return;v=Number(v);if(!Number.isInteger(v)||v<1||v>25)return alert("Use a whole number from 1 to 25.");if(board.includes(v)&&board[i]!==v)return alert("That number is already used.");board[i]=v;marked=marked.filter(x=>x!==i);draw();return save()}if(!board[i])return;marked=marked.includes(i)?marked.filter(x=>x!==i):[...marked,i];draw();await save()}
function renderPlayers(data){let ids=Object.keys(data?.players||{});$("p1").textContent="Player 1: "+(ids[0]?"connected":"waiting");$("p2").textContent="Player 2: "+(ids[1]?"connected":"waiting");["p1","p2"].forEach((x,i)=>$(x).classList.toggle("you",ids[i]===playerId))}
async function save(){if(!db||!room)return;const {ref,set}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");await set(ref(db,`rooms/${room}/players/${playerId}`),{board,marked,updatedAt:Date.now()});status(bingo()?"🎉 BINGO! You completed a line.":"Room "+room+" is live.")}
async function enter(code){room=code.trim().toUpperCase().replace(/[^A-Z0-9-]/g,"");if(!room)return status("Enter a room code first.");const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const {getDatabase,ref,onValue}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");db=getDatabase(initializeApp(firebaseConfig));board=shuffled();marked=[];custom=false;$("roomInput").value=room;$("shareBox").classList.remove("hidden");onValue(ref(db,`rooms/${room}`),snap=>{let data=snap.val()||{};renderPlayers(data);let mine=data.players?.[playerId];if(mine){board=mine.board||board;marked=mine.marked||[];draw()}status(bingo()?"🎉 BINGO! You completed a line.":"Room "+room+" is live. Share the link with your partner.")});await save()}
$("createBtn").onclick=()=>enter(Math.random().toString(36).slice(2,8).toUpperCase());$("joinBtn").onclick=()=>enter($("roomInput").value);$("randomBtn").onclick=()=>{if(!room)return status("Join or create a room first.");board=shuffled();marked=[];custom=false;draw();save()};$("customBtn").onclick=()=>{if(!room)return status("Join or create a room first.");custom=!custom;if(custom){board=Array(25).fill("");marked=[];$("customBtn").textContent="Done"}else if(board.some(x=>!x)){custom=true;return alert("Fill all 25 boxes before clicking Done.")}else $("customBtn").textContent="Customize";draw();save()};$("resetBtn").onclick=()=>{board=shuffled();marked=[];custom=false;$("customBtn").textContent="Customize";draw();save()};$("shareBtn").onclick=async()=>{let url=location.href.split("?")[0]+"?room="+room;try{await navigator.clipboard.writeText(url);status("Share link copied: "+url)}catch{prompt("Copy this link:",url)}};draw();let initial=new URLSearchParams(location.search).get("room");if(initial){$("roomInput").value=initial;enter(initial)}
</script></body></html>
